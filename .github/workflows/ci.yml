name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

# Default token permissions (least privilege). Override per-job when write access is required.
permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jpm-jar
          path: target/jpm-*.jar

  release:
    needs: build
    # grant the release job permission to write repository contents (required to create releases)
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: jpm-jar
          path: target/

      - name: Generate checksums
        run: |
          cd target/
          for jar in jpm-*.jar; do
            sha256sum "$jar" > "$jar.sha256"
            echo "Generated ${jar}.sha256"
          done

      - name: Display build artifacts
        run: ls -lh target/jpm-*

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: |
            Automated release generated by CI for ${{ github.ref_name }}.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_URL: ${{ steps.create_release.outputs.upload_url }}
        run: |
          set -euo pipefail
          UPLOAD_URL_CLEAN="${UPLOAD_URL%\{*}"
          cd target/
          
          for file in jpm-*.jar jpm-*.jar.sha256; do
            if [ -f "$file" ]; then
              echo "Uploading $file..."
              # Determine content type
              if [[ "$file" == *.sha256 ]]; then
                CONTENT_TYPE="text/plain"
              else
                CONTENT_TYPE="application/java-archive"
              fi
              
              # Upload with retry
              for attempt in 1 2 3 4 5; do
                if curl --fail -X POST \
                    -H "Authorization: token ${GITHUB_TOKEN}" \
                    -H "Content-Type: ${CONTENT_TYPE}" \
                    --data-binary @"$file" \
                    "${UPLOAD_URL_CLEAN}?name=$file"; then
                  echo "✓ Upload succeeded: $file"
                  break
                else
                  echo "✗ Attempt $attempt failed for $file"
                  if [ $attempt -lt 5 ]; then
                    sleep $((attempt * 2))
                  else
                    echo "Failed to upload $file after 5 attempts"
                    exit 1
                  fi
                fi
              done
            fi
          done

